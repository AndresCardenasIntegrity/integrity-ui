name: Deploy Showcase to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/showcase/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-showcase.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional override for NUXT_APP_BASE_URL (e.g. /integrity-ui/ or /)'
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Generate Static Showcase
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: ${{ inputs.base_url != '' && inputs.base_url || (steps.pages.outputs.base_path != '' && format('{0}/', steps.pages.outputs.base_path) || '/') }}
        run: pnpm generate

      - name: Ensure .nojekyll exists
        run: touch apps/showcase/.output/public/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/showcase/.output/public

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
