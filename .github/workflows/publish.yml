name: Publish Packages to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run publish in dry-run mode without uploading to npmjs.org'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  publish:
    name: Verify & Publish to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TOKENS_VERSION="$(node -p "require('./packages/tokens/package.json').version")"
          NUXT_VERSION="$(node -p "require('./packages/nuxt/package.json').version")"
          echo "Tag: $TAG_VERSION | tokens: $TOKENS_VERSION | ui-nuxt: $NUXT_VERSION"
          if [ "$TAG_VERSION" != "$TOKENS_VERSION" ] || [ "$TAG_VERSION" != "$NUXT_VERSION" ]; then
            echo "Version mismatch: tag v$TAG_VERSION must match both packages/tokens ($TOKENS_VERSION) and packages/nuxt ($NUXT_VERSION)."
            exit 1
          fi

      - name: Run unit tests
        run: pnpm test

      - name: Typecheck showcase
        run: pnpm typecheck

      - name: Build showcase
        run: pnpm build

      - name: Verify NPM_TOKEN secret is configured
        if: inputs.dry_run != true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "Missing NPM_TOKEN secret. Add an npm Automation/Granular Access Token in Settings -> Secrets and variables -> Actions as NPM_TOKEN."
            exit 1
          fi

      - name: Publish @integritysoftwarela/integrity-tokens
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm --filter @integritysoftwarela/integrity-tokens publish --access public --no-git-checks --dry-run
          else
            pnpm --filter @integritysoftwarela/integrity-tokens publish --access public --no-git-checks
          fi

      - name: Publish @integritysoftwarela/integrity-ui-nuxt
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm --filter @integritysoftwarela/integrity-ui-nuxt publish --access public --no-git-checks --dry-run
          else
            pnpm --filter @integritysoftwarela/integrity-ui-nuxt publish --access public --no-git-checks
          fi
